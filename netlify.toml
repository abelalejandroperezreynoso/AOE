# Despliegue en Netlify.
#
# El juego son archivos estáticos y no necesita compilarse. La única parte
# dinámica es la sala de espera del multijugador: una función que sólo sirve
# para que dos jugadores se encuentren, porque la partida en sí va directa de
# un navegador al otro por WebRTC.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La sala, antes que la regla general de más abajo (gana la primera que encaje).
[[redirects]]
  from = "/api/lobby"
  to = "/.netlify/functions/lobby"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# La página y el manifiesto, sin caché: instalado en la pantalla de inicio no
# hay forma de forzar una recarga, así que una copia guardada de más deja el
# juego en la versión de antes y cualquier arreglo parece que no ha servido.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los módulos y estilos cambian con cada despliegue: sin caché agresiva.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
