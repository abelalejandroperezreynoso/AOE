<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Las mismas etiquetas que index.html: si esta página se comporta distinta,
     no es el aparato, es el juego. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Diagnóstico de pantalla</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /*
   * Página aparte y a propósito casi vacía. El juego tiene mil reglas y
   * cualquiera podría ser la culpable; aquí no hay ninguna, así que lo que se
   * vea es lo que hace el aparato.
   *
   * Dos colores para leerlo de un vistazo:
   *   MAGENTA es el fondo de la página. Se ve donde no llega `inset: 0`.
   *   VERDE   es una caja `position: fixed; inset: 0`, la que usa el juego.
   * Si abajo aparece NEGRO, no llega ninguna de las dos: la barra la pone el
   * sistema y no hay CSS que la quite.
   */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #d6008a; }
  body { font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #06210f; }
  #lleno { position: fixed; inset: 0; background: #00d46a; }

  /* Cada forma de decir "toda la pantalla", con su raya y su nombre al filo. */
  /* El borde va ABAJO: así la raya cae justo en el alto que mide cada unidad.
     Con `border-top` todas salían apiladas en el cero y no decían nada. */
  .marca { position: fixed; top: 0; left: 0; right: 0; border-bottom: 2px dashed rgba(0,0,0,.75); pointer-events: none; }
  .marca span { position: absolute; right: 4px; bottom: 2px; font-size: 11px; font-weight: bold;
                background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 3px; }
  #m-vh  { height: 100vh; }
  #m-dvh { height: 100dvh; }
  #m-svh { height: 100svh; }
  #m-lvh { height: 100lvh; }
  #m-vv  { border-top-color: #b00020; }
  #m-vv span { color: #b00020; }

  /* El panel: por encima de todo y con su propio desplazamiento. */
  #panel {
    position: fixed; left: 6px; right: 6px;
    top: calc(6px + env(safe-area-inset-top, 0px));
    max-height: 74%;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.94); border: 2px solid #06210f; border-radius: 8px;
    padding: 8px;
  }
  h1 { margin: 0; font-size: 14px; }
  .fila { display: flex; flex-wrap: wrap; gap: 4px; }
  button, .boton {
    font: inherit; font-size: 12px; padding: 7px 9px; border: 1px solid #06210f;
    border-radius: 6px; background: #eafff2; color: #06210f; text-decoration: none;
    -webkit-appearance: none; touch-action: manipulation;
  }
  button.destacado { background: #ffe08a; font-weight: bold; }
  input { font: inherit; padding: 8px; width: 100%; border: 1px solid #06210f; border-radius: 6px; }
  #ahora { white-space: pre-wrap; font-size: 12px; margin: 0; }
  #reg { flex: 1; min-height: 90px; width: 100%; font: 11px/1.3 ui-monospace, monospace;
         border: 1px solid #06210f; border-radius: 6px; padding: 6px; resize: none; }
  .pista { margin: 0; font-size: 11.5px; color: #3a4a40; }
</style>
</head>
<body>

<div id="lleno"></div>
<div class="marca" id="m-lvh"><span>lvh</span></div>
<div class="marca" id="m-vh"><span>vh</span></div>
<div class="marca" id="m-dvh"><span>dvh</span></div>
<div class="marca" id="m-svh"><span>svh</span></div>
<div class="marca" id="m-vv"><span>visual</span></div>

<div id="panel">
  <h1>Diagnóstico de pantalla</h1>
  <p class="pista">Verde = <code>inset: 0</code>. Magenta = fondo de la página.
     <b>Negro = ni una ni otra: la barra la pone el sistema.</b></p>
  <p id="ahora">midiendo…</p>
  <input id="campo" type="text" placeholder="Toca aquí para abrir el teclado">
  <div class="fila">
    <button id="b-scroll">scrollTo(0,0)</button>
    <button id="b-reflujo">Forzar reflujo</button>
    <button id="b-soltar">Soltar el campo</button>
    <button id="b-limpiar">Limpiar registro</button>
  </div>
  <textarea id="reg" readonly></textarea>
  <div class="fila">
    <button id="b-copiar" class="destacado">Copiar todo</button>
    <a class="boton" href="/">Volver al juego</a>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const t0 = Date.now();

  // Cuánto mide de verdad cada unidad, midiendo una caja de prueba.
  const caja = document.createElement('div');
  caja.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px';
  document.body.appendChild(caja);
  const alto = (v) => { caja.style.height = v; return Math.round(caja.getBoundingClientRect().height); };

  // Las zonas seguras sólo se resuelven al aplicarse: se miden como relleno.
  const sonda = document.createElement('div');
  sonda.style.cssText = 'position:fixed;left:-9999px;top:0;padding:'
    + 'env(safe-area-inset-top) env(safe-area-inset-right)'
    + ' env(safe-area-inset-bottom) env(safe-area-inset-left)';
  document.body.appendChild(sonda);

  const modo = matchMedia('(display-mode: standalone)').matches ? 'standalone'
    : matchMedia('(display-mode: fullscreen)').matches ? 'fullscreen' : 'navegador';

  function estado() {
    const vv = window.visualViewport;
    const p = getComputedStyle(sonda);
    const sa = [p.paddingTop, p.paddingRight, p.paddingBottom, p.paddingLeft]
      .map((v) => Math.round(parseFloat(v) || 0)).join('/');
    return {
      inner: window.innerHeight,
      raiz: document.documentElement.clientHeight,
      lleno: Math.round($('lleno').getBoundingClientRect().height),
      vv: Math.round(vv?.height || 0),
      vvTop: Math.round(vv?.offsetTop || 0),
      lupa: +(vv?.scale || 1).toFixed(2),
      scroll: Math.round(window.scrollY),
      vh: alto('100vh'), dvh: alto('100dvh'), svh: alto('100svh'), lvh: alto('100lvh'),
      pantalla: `${screen.width}x${screen.height}`,
      dpr: window.devicePixelRatio,
      sa,
    };
  }

  const linea = (s) => `inner ${s.inner} raiz ${s.raiz} lleno ${s.lleno}`
    + ` | vh ${s.vh} dvh ${s.dvh} svh ${s.svh} lvh ${s.lvh}`
    + ` | visual ${s.vv}@${s.vvTop} lupa ${s.lupa} scroll ${s.scroll}`;

  const reg = $('reg');
  const filas = [`# ${modo} · ${navigator.userAgent}`];
  let ultimo = '';

  function apunta(evento, forzar) {
    const s = estado();
    const l = linea(s);
    if (!forzar && l === ultimo) return s;
    ultimo = l;
    filas.push(`${String(Date.now() - t0).padStart(6)}ms ${evento.padEnd(14)} ${l}`);
    if (filas.length > 400) filas.splice(1, 1);
    reg.value = filas.join('\n');
    reg.scrollTop = reg.scrollHeight;
    return s;
  }

  function pinta() {
    const s = apunta('—', false);
    // El veredicto: la unidad más alta es lo que de verdad se puede llenar, y
    // lo que le falte a `inset: 0` para llegar ahí es la franja, en píxeles.
    const tope = Math.max(s.vh, s.dvh, s.svh, s.lvh, s.vv, s.inner);
    const falta = tope - s.lleno;
    $('ahora').textContent =
      `modo ${modo} · pantalla ${s.pantalla} · dpr ${s.dpr} · zonas ${s.sa}\n`
      + `inner ${s.inner} · raiz ${s.raiz} · inset:0 ${s.lleno}\n`
      + `vh ${s.vh} · dvh ${s.dvh} · svh ${s.svh} · lvh ${s.lvh}\n`
      + `visual ${s.vv} desde ${s.vvTop} · lupa ${s.lupa} · scroll ${s.scroll}\n`
      + (falta > 0 ? `► FRANJA de ${falta}px: inset:0 llega a ${s.lleno} y se puede llegar a ${tope}`
                   : '► sin franja: inset:0 llega hasta el tope');
    // La raya roja: hasta dónde dice el aparato que se ve ahora mismo.
    $('m-vv').style.height = `${s.vv}px`;
  }

  for (const ev of ['resize', 'orientationchange', 'scroll', 'focusin', 'focusout', 'pageshow']) {
    window.addEventListener(ev, () => { apunta(ev, true); pinta(); });
  }
  for (const ev of ['resize', 'scroll']) {
    window.visualViewport?.addEventListener(ev, () => { apunta(`vv:${ev}`, true); pinta(); });
  }
  // Y un vistazo continuo, porque hay cambios de los que nadie avisa.
  setInterval(pinta, 250);
  pinta();
  apunta('inicio', true);

  $('b-scroll').onclick = () => { window.scrollTo(0, 0); apunta('scrollTo', true); pinta(); };
  $('b-reflujo').onclick = () => {
    // El truco de siempre: se toca el alto y se obliga a recalcular.
    const d = document.documentElement;
    d.style.height = '100.1%'; void d.offsetHeight; d.style.height = '';
    apunta('reflujo', true); pinta();
  };
  $('b-soltar').onclick = () => { document.activeElement?.blur(); apunta('blur', true); pinta(); };
  $('b-limpiar').onclick = () => { filas.length = 1; reg.value = filas[0]; ultimo = ''; };
  $('b-copiar').onclick = async () => {
    const b = $('b-copiar');
    try { await navigator.clipboard.writeText(reg.value); b.textContent = '¡Copiado!'; }
    catch { reg.select(); document.execCommand?.('copy'); b.textContent = 'Selecciónalo y copia'; }
    setTimeout(() => { b.textContent = 'Copiar todo'; }, 2000);
  };
})();
</script>
</body>
</html>
