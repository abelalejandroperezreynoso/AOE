<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de modelos — Age of Realms II</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #22301e; color: #e8e2c8; font: 14px/1.4 "Trebuchet MS", sans-serif; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    padding: 10px 14px; background: #17130d; border-bottom: 2px solid #6b5a34;
    position: sticky; top: 0; z-index: 2;
  }
  header label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  select, input[type="number"] { background: #2a241a; color: inherit; border: 1px solid #6b5a34; border-radius: 4px; padding: 3px 6px; }
  input[type="range"] { width: 110px; }
  button { background: #4a3d24; color: inherit; border: 1px solid #8a744a; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  main { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: #1b2417; border: 1px solid #3a4a30; border-radius: 6px; padding: 10px; overflow: auto; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; color: #cdbd8c; text-transform: uppercase; letter-spacing: 1px; }
  canvas { image-rendering: pixelated; display: block; }
  #detail-wrap { position: relative; display: inline-block; }
  #ref { position: absolute; left: 0; top: 0; pointer-events: none; transform-origin: 0 0; }
  .hint { color: #9aa58a; font-size: 12px; }
</style>
</head>
<body>
<header>
  <label>Clase
    <select id="kind">
      <option value="unit">Unidad</option>
      <option value="building">Edificio</option>
      <option value="node">Recurso</option>
    </select>
  </label>
  <label>Tipo <select id="type"></select></label>
  <label>Color <select id="color"></select></label>
  <label>Zoom <input id="zoom" type="range" min="1" max="10" value="4"><span id="zoom-val">4</span></label>
  <label>Resolución
    <select id="res">
      <option value="2">de juego (2×)</option>
      <option value="4">fina (4×)</option>
    </select>
  </label>
  <button id="rerender">Volver a hornear</button>
  <label class="hint">Referencia <input id="ref-file" type="file" accept="image/*"></label>
  <label>Opacidad <input id="ref-op" type="range" min="0" max="100" value="45"></label>
  <label>Escala ref. <input id="ref-sc" type="range" min="10" max="400" value="100"></label>
</header>
<main>
  <div class="panel">
    <h2 id="detail-title">Detalle</h2>
    <div id="detail-wrap">
      <canvas id="detail"></canvas>
      <img id="ref" alt="" style="opacity:.45">
    </div>
    <p class="hint">Arrastra sobre el detalle para mover la imagen de referencia. Los parámetros
      viven en la URL: <code>?kind=unit&amp;type=knight&amp;color=1&amp;zoom=6&amp;face=1&amp;frame=0</code></p>
    <label>Orientación / etapa / variante <input id="pose-a" type="range" min="0" max="7" value="1"><span id="pose-a-val">1</span></label>
    <label>Fotograma <input id="pose-b" type="range" min="0" max="5" value="0"><span id="pose-b-val">0</span></label>
  </div>
  <div class="panel">
    <h2 id="grid-title">Todas las vistas</h2>
    <canvas id="grid"></canvas>
  </div>
</main>
<script type="module">
import { bake } from '../js/gfx3d/engine.js';
import { unitMesh } from '../js/gfx3d/units.js';
import { buildingMesh } from '../js/gfx3d/buildings.js';
import { nodeMesh } from '../js/gfx3d/nodes.js';
import { UNITS, BUILD_ORDER, PLAYER_COLORS, RESOURCE_NODES } from '../js/config.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);

const NODE_KINDS = [...Object.keys(RESOURCE_NODES), 'stump'];
const TYPES = {
  unit: Object.keys(UNITS),
  building: BUILD_ORDER,
  node: NODE_KINDS,
};

// --- Controles ---------------------------------------------------------------

for (const [i, c] of PLAYER_COLORS.entries()) {
  $('color').add(new Option(c.name, i));
}
function fillTypes() {
  const kind = $('kind').value;
  $('type').innerHTML = '';
  for (const t of TYPES[kind]) $('type').add(new Option(t, t));
}
$('kind').value = q.get('kind') || 'unit';
fillTypes();
if (q.get('type')) $('type').value = q.get('type');
$('color').value = q.get('color') || '0';
$('zoom').value = q.get('zoom') || '4';
$('res').value = q.get('res') || '2';
$('pose-a').value = q.get('face') || '1';
$('pose-b').value = q.get('frame') || '0';

function syncURL() {
  const p = new URLSearchParams({
    kind: $('kind').value, type: $('type').value, color: $('color').value,
    zoom: $('zoom').value, res: $('res').value,
    face: $('pose-a').value, frame: $('pose-b').value,
  });
  history.replaceState(null, '', '?' + p);
}

// --- Horneado ----------------------------------------------------------------

function mesh(kind, type, colorIdx, a, b) {
  if (kind === 'unit') return unitMesh(type, colorIdx, a, b);
  if (kind === 'building') return buildingMesh(type, colorIdx, a);
  return nodeMesh(type, a, b === 1);
}

/** Celdas de la rejilla según la clase: [etiqueta, a, b]. */
function cells(kind) {
  if (kind === 'unit') {
    const out = [];
    for (let f = 0; f < 6; f++) for (let face = 0; face < 8; face++) {
      out.push([`o${face} f${f}`, face, f]);
    }
    return { cols: 8, list: out };
  }
  if (kind === 'building') {
    return { cols: 3, list: [['cimientos', 0, 0], ['en obra', 1, 0], ['terminado', 2, 0]] };
  }
  const out = [];
  for (let v = 0; v < 4; v++) out.push([`variante ${v}`, v, 0]);
  out.push(['agotado', 0, 1]);
  return { cols: 5, list: out };
}

function drawSpriteAt(ctx, s, x, y, zoom) {
  ctx.drawImage(s.canvas, x - s.ox * zoom, y - s.oy * zoom, s.w * zoom, s.h * zoom);
}

function renderDetail() {
  const kind = $('kind').value, type = $('type').value;
  const color = +$('color').value, zoom = +$('zoom').value, res = +$('res').value;
  const a = +$('pose-a').value, b = +$('pose-b').value;
  const s = bake(mesh(kind, type, color, a, b), { res });
  const c = $('detail');
  c.width = Math.ceil(s.w * zoom) + 20;
  c.height = Math.ceil(s.h * zoom) + 20;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#4a6b3a';
  ctx.fillRect(0, 0, c.width, c.height);
  drawSpriteAt(ctx, s, s.ox * zoom + 10, s.oy * zoom + 10, zoom);
  $('detail-title').textContent = `Detalle — ${type} (${s.canvas.width}×${s.canvas.height} px de sprite)`;
}

function renderGrid() {
  const kind = $('kind').value, type = $('type').value;
  const color = +$('color').value, res = +$('res').value;
  const zoom = Math.max(1, Math.min(3, +$('zoom').value - 1));
  const { cols, list } = cells(kind);
  const sprites = list.map(([label, a, b]) => [label, bake(mesh(kind, type, color, a, b), { res })]);
  const cw = Math.max(...sprites.map(([, s]) => s.w)) * zoom + 16;
  const chh = Math.max(...sprites.map(([, s]) => s.h)) * zoom + 30;
  const rows = Math.ceil(sprites.length / cols);
  const c = $('grid');
  c.width = cols * cw + 10; c.height = rows * chh + 10;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#4a6b3a';
  ctx.fillRect(0, 0, c.width, c.height);
  sprites.forEach(([label, s], i) => {
    const x = (i % cols) * cw + 8, y = Math.floor(i / cols) * chh + 8;
    drawSpriteAt(ctx, s, x + s.ox * zoom, y + s.oy * zoom, zoom);
    ctx.fillStyle = '#e8e2c8';
    ctx.font = '11px sans-serif';
    ctx.fillText(label, x, y + chh - 12);
  });
  $('grid-title').textContent = `Todas las vistas — ${type}`;
}

function renderAll() {
  const kind = $('kind').value;
  $('pose-a').max = kind === 'unit' ? 7 : kind === 'building' ? 2 : 3;
  $('pose-b').max = kind === 'unit' ? 5 : 1;
  $('pose-a-val').textContent = $('pose-a').value;
  $('pose-b-val').textContent = $('pose-b').value;
  $('zoom-val').textContent = $('zoom').value;
  syncURL();
  renderDetail();
  renderGrid();
}

// --- Imagen de referencia ----------------------------------------------------

const ref = $('ref');
let refPos = { x: 0, y: 0 };
$('ref-file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) ref.src = URL.createObjectURL(f);
});
$('ref-op').addEventListener('input', () => { ref.style.opacity = $('ref-op').value / 100; });
$('ref-sc').addEventListener('input', updateRef);
function updateRef() {
  ref.style.transform = `translate(${refPos.x}px, ${refPos.y}px) scale(${$('ref-sc').value / 100})`;
}
let drag = null;
$('detail-wrap').addEventListener('pointerdown', (e) => { drag = { x: e.clientX - refPos.x, y: e.clientY - refPos.y }; });
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  refPos = { x: e.clientX - drag.x, y: e.clientY - drag.y };
  updateRef();
});
window.addEventListener('pointerup', () => { drag = null; });

// --- Enganches ---------------------------------------------------------------

$('kind').addEventListener('change', () => { fillTypes(); renderAll(); });
for (const id of ['type', 'color', 'zoom', 'res', 'pose-a', 'pose-b']) {
  $(id).addEventListener('input', renderAll);
}
$('rerender').addEventListener('click', () => location.reload());

renderAll();
window.__viewerReady = true; // para las capturas automatizadas
</script>
</body>
</html>
