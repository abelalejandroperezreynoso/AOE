<!-- El icono del juego, dibujado por código como todo lo demás: un torreón con
     sus almenas y su estandarte, con los colores de la interfaz. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a1410"/>
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="#7a5f36" stroke-width="10"/>
  <!-- Torres laterales -->
  <path d="M120 214h72v212h-72z" fill="#9a9a94"/>
  <path d="M320 214h72v212h-72z" fill="#8b8b86"/>
  <path d="M120 214v-34h18v20h18v-20h18v20h18v-20h18v34z" fill="#b4b4ad"/>
  <path d="M320 214v-34h18v20h18v-20h18v20h18v-20h18v34z" fill="#b4b4ad"/>
  <!-- Cuerpo central y tejado -->
  <path d="M192 262h128v164H192z" fill="#d8cba6"/>
  <path d="M256 150l86 96H170z" fill="#a8452f"/>
  <!-- Puerta -->
  <path d="M228 426v-72a28 28 0 0 1 56 0v72z" fill="#3b2a17"/>
  <!-- Estandarte -->
  <path d="M256 150V96" stroke="#7a5f36" stroke-width="9" stroke-linecap="round"/>
  <path d="M260 100h54l-16 20 16 20h-54z" fill="#c9553f"/>
  <!-- Suelo -->
  <path d="M96 426h320v22H96z" fill="#6b5334"/>
</svg>
